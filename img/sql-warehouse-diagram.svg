<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320">
  <defs>
    <style>
      .bg { fill: #fdfdfd; }
      .stage-box { fill: #ffffff; stroke: #e5e5e5; stroke-width: 1.2; rx: 8px; }
      .stage-box-focal { fill: #fffaf7; stroke: #eb6c36; stroke-width: 1.8; rx: 8px; }
      
      .step-pill { fill: #2d3142; rx: 4px; }
      .step-pill-focal { fill: #eb6c36; rx: 4px; }
      .step-pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 9px; font-weight: 700; fill: #ffffff; letter-spacing: 0.08em; text-transform: uppercase; }
      
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #2d3142; letter-spacing: -0.01em; }
      .stage-title-focal { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #eb6c36; letter-spacing: -0.01em; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10px; fill: #4f5d75; }
      
      .item-badge { fill: #f5f5f5; stroke: #e5e5e5; stroke-width: 1; rx: 4px; }
      .item-badge-focal { fill: #fff4ed; stroke: #fcd5c3; stroke-width: 1; rx: 4px; }
      .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #2d3142; font-weight: 500; }
      .item-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 9px; fill: #4f5d75; }

      .conn-line { stroke: #bfc0c0; stroke-width: 1.5; fill: none; }
      .conn-line-focal { stroke: #eb6c36; stroke-width: 2; fill: none; }
      
      .flow-label-bg { fill: #ffffff; stroke: #bfc0c0; stroke-width: 1; rx: 10px; }
      .flow-label-focal-bg { fill: #eb6c36; rx: 10px; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 8.5px; fill: #4f5d75; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
      .flow-label-focal { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 8.5px; fill: #ffffff; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    </style>
    <marker id="m-wh-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
    </marker>
    <marker id="m-wh-focal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="940" height="320" class="bg" rx="10"/>

  <!-- Connecting Pipes -->
  <line x1="205" y1="160" x2="275" y2="160" class="conn-line" marker-end="url(#m-wh-arr)"/>
  <line x1="455" y1="160" x2="525" y2="160" class="conn-line-focal" marker-end="url(#m-wh-focal)"/>
  <line x1="705" y1="160" x2="775" y2="160" class="conn-line" marker-end="url(#m-wh-arr)"/>

  <!-- Flow Action Badges -->
  <g transform="translate(240, 148)">
    <rect x="-36" y="-10" width="72" height="20" class="flow-label-bg"/>
    <text x="0" y="4" text-anchor="middle" class="flow-label">INGEST</text>
  </g>
  
  <g transform="translate(490, 148)">
    <rect x="-40" y="-10" width="80" height="20" class="flow-label-focal-bg"/>
    <text x="0" y="4" text-anchor="middle" class="flow-label-focal">STAR MODEL</text>
  </g>

  <g transform="translate(740, 148)">
    <rect x="-34" y="-10" width="68" height="20" class="flow-label-bg"/>
    <text x="0" y="4" text-anchor="middle" class="flow-label">REPORT</text>
  </g>

  <!-- Stage 1: Transactional Sources -->
  <g transform="translate(25, 45)">
    <rect width="180" height="230" class="stage-box"/>
    <rect x="14" y="14" width="22" height="16" class="step-pill" style="fill:#5e7a9b;"/>
    <text x="25" y="26" text-anchor="middle" class="step-pill-text">01</text>
    <text x="44" y="27" class="stage-title">Source Data</text>
    <text x="14" y="46" class="stage-sub">Operational Databases</text>

    <g transform="translate(14, 62)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Pawn &amp; Loan Records</text>
      <text x="10" y="32" class="item-desc">Daily branch transactions</text>
    </g>

    <g transform="translate(14, 114)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Customer Files</text>
      <text x="10" y="32" class="item-desc">Demographics &amp; KYC info</text>
    </g>

    <g transform="translate(14, 166)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Branch Spreadsheets</text>
      <text x="10" y="32" class="item-desc">Inventory &amp; appraisal logs</text>
    </g>
  </g>

  <!-- Stage 2: Staging & Cleansing -->
  <g transform="translate(275, 45)">
    <rect width="180" height="230" class="stage-box"/>
    <rect x="14" y="14" width="22" height="16" class="step-pill" style="fill:#7c8f6f;"/>
    <text x="25" y="26" text-anchor="middle" class="step-pill-text">02</text>
    <text x="44" y="27" class="stage-title">Staging Layer</text>
    <text x="14" y="46" class="stage-sub">SQL Server ETL</text>

    <g transform="translate(14, 62)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Data Cleansing</text>
      <text x="10" y="32" class="item-desc">Deduplicate &amp; clean types</text>
    </g>

    <g transform="translate(14, 114)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Business Rules</text>
      <text x="10" y="32" class="item-desc">Validate loan status logic</text>
    </g>

    <g transform="translate(14, 166)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Automated Tasks</text>
      <text x="10" y="32" class="item-desc">Scheduled batch jobs</text>
    </g>
  </g>

  <!-- Stage 3: Star Schema Warehouse (Focal - Atomic Tangerine) -->
  <g transform="translate(525, 45)">
    <rect width="180" height="230" class="stage-box-focal"/>
    <rect x="14" y="14" width="22" height="16" class="step-pill-focal"/>
    <text x="25" y="26" text-anchor="middle" class="step-pill-text">03</text>
    <text x="44" y="27" class="stage-title-focal">Star Schema ★</text>
    <text x="14" y="46" class="stage-sub" style="color:#eb6c36;">Clean Analytical Models</text>

    <g transform="translate(14, 62)">
      <rect width="152" height="42" class="item-badge-focal"/>
      <text x="10" y="18" class="item-text" style="font-weight:700; fill:#eb6c36;">Fact Tables</text>
      <text x="10" y="32" class="item-desc">Sales volume, loans &amp; interest</text>
    </g>

    <g transform="translate(14, 114)">
      <rect width="152" height="42" class="item-badge-focal"/>
      <text x="10" y="18" class="item-text" style="font-weight:700; fill:#eb6c36;">Dimension Tables</text>
      <text x="10" y="32" class="item-desc">Branch, Customer, Date, Item</text>
    </g>

    <g transform="translate(14, 166)">
      <rect width="152" height="42" class="item-badge-focal"/>
      <text x="10" y="18" class="item-text" style="font-weight:700; fill:#eb6c36;">Fast Querying</text>
      <text x="10" y="32" class="item-desc">Optimized for rapid lookups</text>
    </g>
  </g>

  <!-- Stage 4: Power BI Analytics -->
  <g transform="translate(775, 45)">
    <rect width="140" height="230" class="stage-box"/>
    <rect x="14" y="14" width="22" height="16" class="step-pill" style="fill:#2e5aa8;"/>
    <text x="25" y="26" text-anchor="middle" class="step-pill-text">04</text>
    <text x="44" y="27" class="stage-title">BI Reports</text>
    <text x="14" y="46" class="stage-sub">Power BI &amp; DAX</text>

    <g transform="translate(14, 62)">
      <rect width="112" height="42" class="item-badge"/>
      <text x="8" y="18" class="item-text">Executive KPI</text>
      <text x="8" y="32" class="item-desc">Revenue &amp; growth</text>
    </g>

    <g transform="translate(14, 114)">
      <rect width="112" height="42" class="item-badge"/>
      <text x="8" y="18" class="item-text">Branch Audit</text>
      <text x="8" y="32" class="item-desc">Daily targets</text>
    </g>

    <g transform="translate(14, 166)">
      <rect width="112" height="42" class="item-badge"/>
      <text x="8" y="18" class="item-text">Inventory Alert</text>
      <text x="8" y="32" class="item-desc">Unclaimed items</text>
    </g>
  </g>
</svg>
