<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <defs>
    <style>
      .bg { fill: #fdfdfd; }
      .stage-box { fill: #ffffff; stroke: #e5e5e5; stroke-width: 1.2; rx: 8px; }
      .stage-box-focal { fill: #fffaf7; stroke: #eb6c36; stroke-width: 1.8; rx: 8px; }
      
      .step-pill { fill: #2d3142; rx: 4px; }
      .step-pill-focal { fill: #eb6c36; rx: 4px; }
      .step-pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 9px; font-weight: 700; fill: #ffffff; letter-spacing: 0.08em; text-transform: uppercase; }
      
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #2d3142; letter-spacing: -0.01em; }
      .stage-title-focal { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #eb6c36; letter-spacing: -0.01em; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10px; fill: #4f5d75; }
      
      .item-badge { fill: #f5f5f5; stroke: #e5e5e5; stroke-width: 1; rx: 4px; }
      .item-badge-focal { fill: #fff4ed; stroke: #fcd5c3; stroke-width: 1; rx: 4px; }
      .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #2d3142; font-weight: 500; }
      .item-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 9px; fill: #4f5d75; }

      .conn-line { stroke: #bfc0c0; stroke-width: 1.5; fill: none; }
      .conn-line-focal { stroke: #eb6c36; stroke-width: 2; fill: none; }
      
      .flow-label-bg { fill: #ffffff; stroke: #bfc0c0; stroke-width: 1; rx: 10px; }
      .flow-label-focal-bg { fill: #eb6c36; rx: 10px; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 8px; fill: #4f5d75; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
      .flow-label-focal { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 8px; fill: #ffffff; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    </style>
    <marker id="m-arr-irr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
    </marker>
    <marker id="m-arr-irr-focal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="320" class="bg" rx="10"/>

  <!-- Connecting Pipes -->
  <!-- Stage 1 (right=200) to Stage 2 (left=270): mid=235 -->
  <line x1="200" y1="160" x2="270" y2="160" class="conn-line" marker-end="url(#m-arr-irr)"/>
  <g transform="translate(235, 148)">
    <rect x="-30" y="-10" width="60" height="20" class="flow-label-bg"/>
    <text x="0" y="3.5" text-anchor="middle" class="flow-label">SENSE</text>
  </g>

  <!-- Stage 2 (right=450) to Stage 3 (left=530): mid=490 -->
  <line x1="450" y1="160" x2="530" y2="160" class="conn-line-focal" marker-end="url(#m-arr-irr-focal)"/>
  <g transform="translate(490, 148)">
    <rect x="-32" y="-10" width="64" height="20" class="flow-label-focal-bg"/>
    <text x="0" y="3.5" text-anchor="middle" class="flow-label-focal">TRIGGER</text>
  </g>

  <!-- Stage 3 (right=710) to Stage 4 (left=790): mid=750 -->
  <line x1="710" y1="160" x2="790" y2="160" class="conn-line" marker-end="url(#m-arr-irr)"/>
  <g transform="translate(750, 148)">
    <rect x="-28" y="-10" width="56" height="20" class="flow-label-bg"/>
    <text x="0" y="3.5" text-anchor="middle" class="flow-label">IRRIGATE</text>
  </g>

  <!-- Stage 1: Edge Sensors & Solar -->
  <g transform="translate(20, 45)">
    <rect width="180" height="230" class="stage-box"/>
    <rect x="14" y="14" width="22" height="16" class="step-pill" style="fill:#5e7a9b;"/>
    <text x="25" y="26" text-anchor="middle" class="step-pill-text">01</text>
    <text x="44" y="27" class="stage-title">Sensor Array</text>
    <text x="14" y="46" class="stage-sub">Field Telemetry Ingest</text>

    <g transform="translate(14, 62)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Capacitive Moisture</text>
      <text x="10" y="32" class="item-desc">Analog frequency probe</text>
    </g>

    <g transform="translate(14, 114)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Ambient Temp/RH</text>
      <text x="10" y="32" class="item-desc">DHT22 microclimate feed</text>
    </g>

    <g transform="translate(14, 166)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Solar Microgrid</text>
      <text x="10" y="32" class="item-desc">12V Battery + MPPT</text>
    </g>
  </g>

  <!-- Stage 2: ESP32 Edge Logic Core [FOCAL] -->
  <g transform="translate(270, 45)">
    <rect width="180" height="230" class="stage-box-focal"/>
    <rect x="14" y="14" width="22" height="16" class="step-pill-focal"/>
    <text x="25" y="26" text-anchor="middle" class="step-pill-text">02</text>
    <text x="44" y="27" class="stage-title-focal">ESP32 Core ★</text>
    <text x="14" y="46" class="stage-sub">Edge Control Algorithm</text>

    <g transform="translate(14, 62)">
      <rect width="152" height="42" class="item-badge-focal"/>
      <text x="10" y="18" class="item-text" style="fill:#eb6c36; font-weight:600;">Hysteresis Logic</text>
      <text x="10" y="32" class="item-desc">Dynamic thresholding loop</text>
    </g>

    <g transform="translate(14, 114)">
      <rect width="152" height="42" class="item-badge-focal"/>
      <text x="10" y="18" class="item-text" style="fill:#eb6c36; font-weight:600;">Telemetry Buffer</text>
      <text x="10" y="32" class="item-desc">SPIFFS local flash logs</text>
    </g>

    <g transform="translate(14, 166)">
      <rect width="152" height="42" class="item-badge-focal"/>
      <text x="10" y="18" class="item-text" style="fill:#eb6c36; font-weight:600;">Watchdog Monitor</text>
      <text x="10" y="32" class="item-desc">Hardware brownout reset</text>
    </g>
  </g>

  <!-- Stage 3: Actuation & Solenoids -->
  <g transform="translate(530, 45)">
    <rect width="180" height="230" class="stage-box"/>
    <rect x="14" y="14" width="22" height="16" class="step-pill" style="fill:#4f5d75;"/>
    <text x="25" y="26" text-anchor="middle" class="step-pill-text">03</text>
    <text x="44" y="27" class="stage-title">Actuation Bank</text>
    <text x="14" y="46" class="stage-sub">Hydraulic Control</text>

    <g transform="translate(14, 62)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Optocoupled Relays</text>
      <text x="10" y="32" class="item-desc">Galvanic circuit isolation</text>
    </g>

    <g transform="translate(14, 114)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">12V Solenoid Valves</text>
      <text x="10" y="32" class="item-desc">Zoned pulse-width flow</text>
    </g>

    <g transform="translate(14, 166)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Flow Hall Sensors</text>
      <text x="10" y="32" class="item-desc">Volume verification</text>
    </g>
  </g>

  <!-- Stage 4: Results & Efficiency -->
  <g transform="translate(760, 45)">
    <rect width="180" height="230" class="stage-box"/>
    <rect x="14" y="14" width="22" height="16" class="step-pill" style="fill:#10b981;"/>
    <text x="25" y="26" text-anchor="middle" class="step-pill-text">04</text>
    <text x="44" y="27" class="stage-title">System Impact</text>
    <text x="14" y="46" class="stage-sub">Field Performance</text>

    <g transform="translate(14, 62)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text" style="color:#047857; font-weight:600;">46% Water Saved</text>
      <text x="10" y="32" class="item-desc">Optimized soil moisture</text>
    </g>

    <g transform="translate(14, 114)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">100% Solar Driven</text>
      <text x="10" y="32" class="item-desc">Grid-independent edge</text>
    </g>

    <g transform="translate(14, 166)">
      <rect width="152" height="42" class="item-badge"/>
      <text x="10" y="18" class="item-text">Field Validated</text>
      <text x="10" y="32" class="item-desc">EE Undergraduate Thesis</text>
    </g>
  </g>
</svg>
